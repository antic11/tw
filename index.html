<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소장품 등록 모달 예시</title>
  <style>
    /* 기본 버튼 스타일 */
    .btn-open {
      padding: 10px 18px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-open:hover {
      background-color: #1d4ed8;
    }

    /* 모달 배경 (Dim) */
    .modal-overlay {
      display: none; /* 기본 숨김 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    /* 모달 박스 */
    .modal-content {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      color: #111827;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #6b7280;
    }

    /* 이미지 업로드 영역 (Drop Zone) */
    .upload-zone {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background-color: #f9fafb;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #2563eb;
      background-color: #eff6ff;
    }

    .upload-zone p {
      margin: 8px 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    /* 숨김 처리된 실제 file input */
    #fileInput {
      display: none;
    }

    /* 이미지 미리보기 영역 */
    .preview-container {
      display: none;
      position: relative;
      margin-top: 12px;
      width: 100%;
      max-height: 240px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* 입력 폼 스타일 */
    .form-group {
      margin-top: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }

    /* 버튼 그룹 */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-secondary {
      padding: 8px 16px;
      background-color: #e5e7eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. 소장품 등록 버튼 -->
  <button id="openModalBtn" class="btn-open">+ 소장품 등록</button>

  <!-- 2. 모달 영역 -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>새 소장품 등록</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="collectionForm">
        <!-- 이미지 클릭 & 드래그 영역 -->
        <div id="uploadZone" class="upload-zone">
          <svg width="40" height="40" fill="none" stroke="#9ca3af" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <p>클릭하거나 이미지를 끌어다 놓으세요</p>
        </div>

        <!-- 숨겨진 file input -->
        <input type="file" id="fileInput" accept="image/*">

        <!-- 선택한 이미지 미리보기 -->
        <div id="previewContainer" class="preview-container">
          <img id="imagePreview" src="" alt="미리보기">
        </div>

        <!-- 소장품 이름 입력 -->
        <div class="form-group">
          <label for="itemTitle">소장품 이름</label>
          <input type="text" id="itemTitle" placeholder="예: 빈티지 카메라" required>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn-secondary">취소</button>
          <button type="submit" class="btn-primary">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // DOM 요소 선택
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const collectionForm = document.getElementById('collectionForm');

    // 모달 열기
    openModalBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'flex';
    });

    // 모달 닫기 함수
    const closeModal = () => {
      modalOverlay.style.display = 'none';
      resetForm();
    };

    closeModalBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);

    // 모달 바깥 배경 클릭 시 닫기
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // 업로드 영역 클릭 시 파일 창 열기
    uploadZone.addEventListener('click', () => {
      fileInput.click();
    });

    // 파일 선택 시 이벤트
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      handleImageFile(file);
    });

    // Drag & Drop 지원
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        fileInput.files = e.dataTransfer.files; // input에 파일 저장
        handleImageFile(file);
      }
    });

    // 선택한 파일 이미지 미리보기 처리
    function handleImageFile(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        imagePreview.src = e.target.result;
        previewContainer.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // Form 제출 처리
    collectionForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const title = document.getElementById('itemTitle').value;
      const file = fileInput.files[0];

      if (!file) {
        alert('소장품 사진을 첨부해 주세요.');
        return;
      }

      console.log('등록 성공:', { title, file });
      alert(`"${title}" 소장품이 성공적으로 등록되었습니다!`);
      closeModal();
    });

    // 폼 초기화
    function resetForm() {
      collectionForm.reset();
      imagePreview.src = '';
      previewContainer.style.display = 'none';
    }
  </script>
</body>
</html>
